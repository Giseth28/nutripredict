<VirtualHost *:80>
    DocumentRoot /var/www/html

    # ── API Gateway: permitir reescritura de URLs ─────────────────────────────
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/nutripredict_error.log
    CustomLog ${APACHE_LOG_DIR}/nutripredict_access.log combined
</VirtualHost>
